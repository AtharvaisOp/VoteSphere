{% extends "base.html" %}

{% block title %}Logged Out - VoteSphere{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 text-center">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="fas fa-sign-out-alt fa-4x text-primary"></i>
                    </div>
                    <h2 class="mb-3">Successfully Logged Out</h2>
                    <p class="text-muted mb-4">
                        Your session has been securely terminated. Thank you for using VoteSphere!
                    </p>

                    <div class="d-grid gap-3">
                        <a href="{% url 'request_otp' %}" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Login Again
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-home me-2"></i>Return to Home
                        </a>
                    </div>

                    <div class="mt-4 p-3 bg-light rounded">
                        <small class="text-muted">
                            <i class="fas fa-shield-check me-2 text-success"></i>
                            Your voting data remains secure and anonymous
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 15px;
    }

    .btn {
        border-radius: 8px;
        font-weight: 600;
        padding: 12px;
    }
</style>
{% endblock %}
